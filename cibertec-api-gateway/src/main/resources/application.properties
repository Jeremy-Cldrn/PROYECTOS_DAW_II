spring.application.name=cibertec-api-gateway

server.port=8090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.mvc.routes[0].id=orders-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8091
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/orders-service/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1
#http://cibertec-api-gateway/orders-service/pagos
#http://orders-service/pagos
spring.cloud.gateway.mvc.routes[1].id=inventory-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8092
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/inventory-service/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.mvc.routes[2].id=employee-service
